# This rule is not used by the project ephemeral-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ephemeral.backenddecoded99.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephemeral-operator
    app.kubernetes.io/managed-by: kustomize
  name: ephemeraldeployment-editor-role
rules:
- apiGroups:
  - ephemeral.backenddecoded99.github.io
  resources:
  - ephemeraldeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ephemeral.backenddecoded99.github.io
  resources:
  - ephemeraldeployments/status
  verbs:
  - get
