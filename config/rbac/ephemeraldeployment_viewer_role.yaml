# This rule is not used by the project ephemeral-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ephemeral.backenddecoded99.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephemeral-operator
    app.kubernetes.io/managed-by: kustomize
  name: ephemeraldeployment-viewer-role
rules:
- apiGroups:
  - ephemeral.backenddecoded99.github.io
  resources:
  - ephemeraldeployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ephemeral.backenddecoded99.github.io
  resources:
  - ephemeraldeployments/status
  verbs:
  - get
